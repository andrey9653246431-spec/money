name: Price comparison bot

on:
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Длительность сессии бота, минут"
        type: number
        required: false
        default: 50
  schedule:
    # Бот работает сессиями: каждый час запускается и живёт ~50 минут.
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: price-bot
  cancel-in-progress: false

jobs:
  bot:
    # Scheduled sessions stay off until the repository variable is explicitly enabled.
    if: github.event_name == 'workflow_dispatch' || vars.PRICE_BOT_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: pip install -r price_bot/requirements.txt

      - name: Run bot session
        env:
          PRICE_BOT_TOKEN: ${{ secrets.PRICE_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_SESSION_MINUTES: ${{ inputs.session_minutes || 50 }}
          BOT_LAT: ${{ vars.BOT_LAT }}
          BOT_LON: ${{ vars.BOT_LON }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_TO: ${{ vars.SMTP_TO }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python -m price_bot.bot

      - name: Commit bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/bot
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "[skip ci] Price bot state"
            git push || (git pull --rebase origin main && git push)
          fi
