[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbp-design-factory"
version = "1.0.0"
description = "Фабрика фирменных карточек для канала «Деньги без паники»"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Деньги без паники"}]
dependencies = ["Pillow>=11,<14"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
dbp-design = "design_factory.cli:main"

[tool.setuptools.packages.find]
include = ["design_factory*", "scripts*", "price_bot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
