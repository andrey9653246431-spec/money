name: Publish approved MAX content

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Слот публикации"
        type: choice
        required: true
        options: [morning, day, evening]
      content_date:
        description: "Дата JSON, например 2026-11-12"
        type: string
        required: true
      dry_run:
        description: "Только проверить, не отправлять"
        type: boolean
        required: true
        default: true
  schedule:
    # На 5 минут позже Telegram, чтобы не было гонки за генерацией JSON.
    - cron: "8 9 * * *"
      timezone: "Europe/Moscow"
    - cron: "8 13 * * *"
      timezone: "Europe/Moscow"
    - cron: "8 20 * * *"
      timezone: "Europe/Moscow"

permissions:
  contents: write

concurrency:
  group: max-production-publish
  cancel-in-progress: false

jobs:
  publish:
    # Scheduled publishing stays off until the repository variable is explicitly enabled.
    if: github.event_name == 'workflow_dispatch' || vars.MAX_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Russian Trusted CA for MAX API
        run: |
          set -euo pipefail
          sudo curl -fsSL -o /usr/local/share/ca-certificates/russian_trusted_root_ca.crt \
            https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt
          sudo curl -fsSL -o /usr/local/share/ca-certificates/russian_trusted_sub_ca.crt \
            https://gu-st.ru/content/lending/russian_trusted_sub_ca_pem.crt
          sudo update-ca-certificates

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Select date and slot
        id: context
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
          MANUAL_DATE: ${{ inputs.content_date }}
        run: |
          set -euo pipefail
          case "${EVENT_SCHEDULE:-manual}" in
            "8 9 * * *") SLOT=morning ;;
            "8 13 * * *") SLOT=day ;;
            "8 20 * * *") SLOT=evening ;;
            manual) SLOT="$MANUAL_SLOT" ;;
            *) echo "Unknown schedule: $EVENT_SCHEDULE"; exit 1 ;;
          esac
          DATE="${MANUAL_DATE:-$(TZ=Europe/Moscow date +%F)}"
          case "$SLOT" in morning|day|evening) ;; *) echo "Bad slot"; exit 1 ;; esac
          test -n "$DATE"
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - name: Generate approved JSON if missing
        env:
          CONTENT_FILE: content/approved/${{ steps.context.outputs.date }}.json
          CONTENT_DATE: ${{ steps.context.outputs.date }}
        run: |
          set -euo pipefail
          if [ -f "$CONTENT_FILE" ]; then
            echo "Используем существующий редакционный файл: $CONTENT_FILE"
          else
            python scripts/generate_content.py \
              --date "$CONTENT_DATE" \
              --library content/generator/library.json \
              --output "$CONTENT_FILE"
          fi

      - name: Validate approved JSON
        run: |
          python scripts/validate_content.py \
            --file "content/approved/${{ steps.context.outputs.date }}.json" \
            --slot "${{ steps.context.outputs.slot }}" \
            --require-approved

      - name: Render cards
        run: |
          dbp-design build \
            --input "content/approved/${{ steps.context.outputs.date }}.json" \
            --out "dist/${{ steps.context.outputs.date }}"

      - name: Publish one slot or dry-run
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          MAX_CHANNEL_URL: ${{ vars.MAX_CHANNEL_URL }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          python scripts/publish_max.py \
            --content "content/approved/${{ steps.context.outputs.date }}.json" \
            --slot "${{ steps.context.outputs.slot }}" \
            --image-dir "dist/${{ steps.context.outputs.date }}" \
            --state-dir state/max \
            --archive-dir content/published \
            --dry-run "$DRY_RUN"

      - name: Commit publication state
        if: success() && (github.event_name == 'schedule' || inputs.dry_run == false)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/max content/published \
            "content/approved/${{ steps.context.outputs.date }}.json"
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "[skip ci] Publish MAX ${{ steps.context.outputs.date }} ${{ steps.context.outputs.slot }}"
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Keep audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: max-${{ steps.context.outputs.date }}-${{ steps.context.outputs.slot }}
          path: |
            dist/${{ steps.context.outputs.date }}/
            state/max/
            content/approved/${{ steps.context.outputs.date }}.json
          retention-days: 7
